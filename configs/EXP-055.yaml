# EXP-055: = EXP-051 (text ALWAYS on + aux head) + `text_noise: 1.0` — per-dim
# Gaussian jitter (1 sd of the z-scored text block) on every batch. Revised
# 2026-09-05 after EXP-053: confining text to stat-dropout batches erased the
# day-0 gain entirely (.5384 vs .5387), so the +1.2 of 050/051 is learned in
# the stats batches — stats teach the text pathway. Noise is the mechanism
# that keeps that teaching while denying the memorisable card id (nearest
# different card cos .90 vs random .66). One lever vs EXP-051.
# Bars: none ≥ .5509 (051); week1/full within 0.2 of .6801/.6855 (033).
exp: EXP-055
text_features: bge-base
text_noise: 1.0
stat_aux_lambda: 0.1
corpus: configs/corpus/pretrain_v2.yaml
track_set: HOB
select_on: [none, week1]
seed: 17
batch_drafts: 64
total_steps: 20000
emb_dim: 256
layers: 8
heads: 8
dropout: 0.1
stat_dropout: 0.25
label_smoothing: 0.05
skill_filter:
  min_win_rate: 0.54
  min_games: 50
peak_lr: 2.0e-4
lr_warmup: 1000
weight_decay: 0.01
grad_clip: 1.0
eval_every: 1000
