# EXP-053: = EXP-051 + `text_when: statless` (journal 2026-09-05). EXP-050/051
# bought +1.2 at day 0 but paid ~1pt with stats on the never-seen set while
# in-corpus MSH went UP — text×stats combinations that fit corpus cards and
# do not transfer. Here the text block is present ONLY in stat-dropout
# batches and, at inference, only when stats are missing: text is a day-0
# fallback and week1/full run the EXP-033 pathway exactly. One lever vs 051.
# Bars: none ≥ .5509 (051) ; week1/full within 0.2 of .6801/.6855 (033).
exp: EXP-053
text_features: bge-base
text_when: statless
stat_aux_lambda: 0.1
corpus: configs/corpus/pretrain_v2.yaml
track_set: HOB
select_on: [none, week1]
seed: 17
batch_drafts: 64
total_steps: 20000
emb_dim: 256
layers: 8
heads: 8
dropout: 0.1
stat_dropout: 0.25
label_smoothing: 0.05
skill_filter:
  min_win_rate: 0.54
  min_games: 50
peak_lr: 2.0e-4
lr_warmup: 1000
weight_decay: 0.01
grad_clip: 1.0
eval_every: 1000
